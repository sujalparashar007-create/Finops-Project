# ==============================================================================
# Bootstrap Factory — FinOps Service Account Configuration
# ==============================================================================
# Consolidated from the former `identities-factory` module. One entry per
# FinOps service account under `service_accounts:`. The map key is the SA
# account_id. Edit this file and re-run bootstrap to change what gets created
# — no Terraform code changes needed.
# ==============================================================================

service_accounts:
  finops-workload-sa:
    project_id: finops-foundation-test-0001
    display_name: "FinOps Workload Service Account"
    roles:
      - roles/logging.logWriter
      - roles/monitoring.metricWriter

