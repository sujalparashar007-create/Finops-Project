# ==============================================================================
# Bootstrap Factory — FinOps Project Configuration
# ==============================================================================
# Consolidated from the former `project-factory` module. One entry per FinOps
# project under `projects:`. The map key is the GCP project_id. Project-level
# additive IAM goes under `iam_bindings_additive`. Edit this file and re-run
# bootstrap to change what gets created — no Terraform code changes needed.
# ==============================================================================

projects:
  finops-foundation-test-0001:
    folder_name: "finops-foundation"
    activate_apis:
      - cloudresourcemanager.googleapis.com
      - iam.googleapis.com
      - serviceusage.googleapis.com
      - cloudbilling.googleapis.com
    labels:
      team: finops
      environment: dev
      cost_center: "12345"
      app: finops
      owner: owner-finops
      location: us

